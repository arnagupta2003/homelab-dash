# =============================================================================
# FAQs (Shown on the FAQs page)
# =============================================================================
faqs:
  - question: How do I back up my phone photos to Immich?
    answer: Open the Immich app on your phone (or visit photos.kontour.in). In settings, make sure Automatic Backup is turned ON. Whenever you are on Wi-Fi, your photos and videos will back up safely to ARCUBE.

  - question: How do I watch or request movies and TV shows?
    answer: Click Jellyfin (jellyfin.kontour.in) to watch what's already available. Want a new movie or show? Request it via Jellyseerr, or check Radarr/Sonarr.

  - question: How do I check the home security cameras?
    answer: Click Cameras (camera.kontour.in) on the Services page to view live feeds and recorded events.

  - question: Where do I find family bills, IDs, and PDFs?
    answer: Click Paperless (docs.kontour.in) to search and view scanned family documents, bills, and receipts.

  - question: What should I do if a website doesn't open?
    answer: First, check your internet connection—if you are outside the house, make sure the Tailscale app switch is turned ON. Wait 1 minute and refresh. If it still doesn't load, send a message on the Contact Arnav page.

  - question: How do I use ARCUBE apps when I'm traveling?
    answer: Open the Tailscale app on your phone or laptop and turn it ON. Once connected, all ARCUBE links work just like at home.
