<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARCUBE — Services &amp; Support</title>
  <meta name="description" content="ARCUBE services, FAQs, and support." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen bg-[#09090b] text-zinc-100 antialiased selection:bg-zinc-700 selection:text-white">
  <div class="min-h-screen bg-[#09090b] text-zinc-100">
    <!-- Mobile Sticky Header -->
    <header class="sticky top-0 z-30 flex items-center justify-between border-b border-zinc-800/80 bg-[#09090b]/95 px-4 py-3 backdrop-blur md:hidden">
      <div class="flex items-center gap-2.5">
        <div id="mobile-initials" class="flex h-7 w-7 items-center justify-center rounded-md border border-zinc-700 bg-zinc-900 font-mono-code text-xs font-semibold">AC</div>
        <span id="mobile-brand-title" class="text-sm font-semibold">ARCUBE</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="mobile-mode-toggle" class="rounded-md border border-zinc-700 bg-zinc-900 px-2.5 py-1.5 text-xs font-medium text-zinc-200 hover:bg-zinc-800">
          User
        </button>
        <button id="mobile-menu-btn" aria-label="Toggle navigation" class="rounded-md border border-zinc-800 p-1.5 text-zinc-300 hover:bg-zinc-900">
          <i data-lucide="menu" class="h-4 w-4"></i>
        </button>
      </div>
    </header>

    <!-- Mobile Navigation Drawer -->
    <div id="mobile-drawer" class="fixed inset-0 z-40 hidden md:hidden">
      <div id="mobile-drawer-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm"></div>
      <aside class="relative z-50 flex h-full w-64 flex-col justify-between border-r border-zinc-800 bg-[#09090b] p-4">
        <div>
          <div class="mb-6 flex items-center justify-between px-2 pt-1">
            <div class="flex items-center gap-3">
              <div id="drawer-initials" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-zinc-700 bg-zinc-900 font-mono-code text-sm font-semibold text-zinc-100">AC</div>
              <div class="min-w-0">
                <p id="drawer-brand-title" class="truncate text-sm font-semibold text-zinc-100">ARCUBE</p>
                <p id="drawer-brand-subtitle" class="truncate text-xs text-zinc-400">Home Services</p>
              </div>
            </div>
            <button id="mobile-drawer-close" aria-label="Close navigation" class="rounded-md p-1 text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
          <nav id="mobile-nav" class="space-y-1"></nav>
        </div>
        <div class="space-y-2 border-t border-zinc-800/80 pt-4">
          <button id="drawer-contact-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-zinc-100 px-3 py-2 text-xs font-semibold text-zinc-950 transition-colors hover:bg-zinc-200">
            <i data-lucide="message-square" class="h-3.5 w-3.5"></i>
            <span>Contact Arnav</span>
          </button>
        </div>
      </aside>
    </div>

    <!-- Main Layout -->
    <div class="mx-auto flex max-w-6xl">
      <!-- Desktop Sidebar -->
      <aside class="sticky top-0 hidden h-screen w-60 shrink-0 border-r border-zinc-800/80 md:block">
        <div class="flex h-full flex-col justify-between p-4">
          <div>
            <div class="mb-6 flex items-center gap-3 px-2 pt-1">
              <div id="sidebar-initials" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-zinc-700 bg-zinc-900 font-mono-code text-sm font-semibold text-zinc-100">AC</div>
              <div class="min-w-0">
                <p id="sidebar-brand-title" class="truncate text-sm font-semibold text-zinc-100">ARCUBE</p>
                <p id="sidebar-brand-subtitle" class="truncate text-xs text-zinc-400">Home Services</p>
              </div>
            </div>

            <nav id="desktop-nav" class="space-y-1"></nav>
          </div>

          <div class="space-y-2.5 border-t border-zinc-800/80 pt-4">
            <!-- User / Admin Mode Switch -->
            <div class="rounded-lg border border-zinc-800/90 bg-zinc-900/50 p-2.5">
              <div class="flex items-center justify-between">
                <span class="text-[11px] font-medium text-zinc-400">Mode</span>
                <span id="mode-badge" class="rounded bg-emerald-500/10 px-1.5 py-0.5 text-[10px] font-medium text-emerald-400">User</span>
              </div>
              <button id="desktop-mode-toggle" class="mt-2 flex w-full items-center justify-between rounded-md border border-zinc-800 bg-zinc-950 px-2.5 py-1.5 text-xs font-medium text-zinc-200 transition-colors hover:border-zinc-700 hover:bg-zinc-900">
                <span id="mode-toggle-label">Switch to Admin</span>
                <i data-lucide="shield" class="h-3.5 w-3.5 text-zinc-400"></i>
              </button>
            </div>

            <button id="sidebar-contact-btn" class="flex w-full items-center justify-center gap-2 rounded-md bg-zinc-100 px-3 py-2 text-xs font-semibold text-zinc-950 transition-colors hover:bg-zinc-200">
              <i data-lucide="message-square" class="h-3.5 w-3.5"></i>
              <span id="sidebar-contact-label">Contact Arnav</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="min-w-0 flex-1 px-4 py-6 sm:px-8 sm:py-8">
        <!-- Top Status Banner -->
        <div id="status-banner" class="mb-6 flex flex-wrap items-center justify-between gap-3 rounded-lg border border-zinc-800/90 bg-zinc-900/50 px-4 py-2.5">
          <div class="flex items-center gap-2.5 text-xs sm:text-sm">
            <span id="banner-dot" class="h-2 w-2 rounded-full bg-emerald-400"></span>
            <span id="banner-text" class="font-medium text-zinc-200">ARCUBE services are online</span>
          </div>
          <div class="flex items-center gap-2 text-xs text-zinc-400">
            <i data-lucide="shield-check" class="h-3.5 w-3.5"></i>
            <span id="banner-location">ARCUBE Private Cloud</span>
          </div>
        </div>

        <!-- Dynamic View Container -->
        <div id="view-container" class="space-y-6"></div>
      </main>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="pointer-events-none fixed bottom-5 right-5 z-50 translate-y-4 rounded-lg border border-zinc-700 bg-zinc-900 px-3.5 py-2 text-xs font-medium text-zinc-100 opacity-0 shadow-lg transition-all duration-200"></div>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="./app.js?v=20261127-3"></script>
</body>
</html>
